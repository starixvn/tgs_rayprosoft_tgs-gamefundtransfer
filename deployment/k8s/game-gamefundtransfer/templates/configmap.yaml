apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamefundtransfer.fullname" . }}
  labels:
    {{- include "game-gamefundtransfer.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "Kestrel": {
        "EndpointDefaults": {
          "Protocols": "Http2"
        },
        "Endpoints": {
          "Http": {
            "Url": "http://*:{{ .Values.service.targetPort }}",
            "Protocols": "Http1"
          },
          "Grpc": {
            "Url": "http://*:{{ .Values.service.grpc.targetPort }}",
            "Protocols": "Http2"
          }
        }
      },
      "GameTransfer": {
        "GameProvidersClientBaseUrl": "http://game-gameproviders",
        "CashServiceClientBaseUrl": "http://cashservice-api",
        "GameCurrencyClientBaseUrl": "http://game-gamecurrency",
        "GameInterfaceSabaClientBaseUrl": "http://game-gameinterface-saba-service:9090"
      },
      "FundsLockedSetting": {
        "LockSeconds": 60
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]